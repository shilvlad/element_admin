name: Deploy

on:
  push:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      SECRET_KEY: ci-test-secret
      PASSWORD_ENCRYPTION_KEY: Y0WAbD43xfa-XkTPNXZHX0eAvup-V84_QIuVjBL4kXI=
      MATRIX_HOMESERVER: https://example.invalid
      MATRIX_SERVER_NAME: example.invalid
      MATRIX_ADMIN_TOKEN: ci-test-token
      GLOBAL_ROOM_ID: "!test:example.invalid"
      SMTP_HOST: localhost
      SMTP_USER: ci-test
      SMTP_PASSWORD: ci-test-password
      ADMIN_EMAIL: ci-test@example.com
      ADMIN_USERNAME: ci-test-admin
      ADMIN_PASSWORD_HASH: '$argon2id$v=19$m=65536,t=3,p=4$Po2CjO4YcNaojDD+u9FiTA$hgSkneDmC513CTl7N+Y8tqT+0V1SJGsMyTJAQS0FMe8'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/element_admin && \
             git fetch origin master && \
             git reset --hard origin/master && \
             docker compose config --quiet && \
             docker compose build && \
             docker compose up -d --wait && \
             curl -fsS http://127.0.0.1:8080/health && \
             docker compose ps'
