{% extends "base.html" %}{% block content %}<h1>Пользователи Synapse</h1><form class="search"><input name="q" value="{{ q }}" placeholder="Логин или ФИО"><button>Найти</button></form><table><tr><th>User ID</th><th>ФИО</th><th>Статус</th><th>Действия</th></tr>{% for u in users %}<tr><td>{{ u.name }}</td><td>{{ u.displayname or "" }}</td><td>{% if u.deactivated %}<span class="badge rejected">DEACTIVATED</span>{% else %}<span class="badge approved">ACTIVE</span>{% endif %}</td><td><form class="inline" method="post" action="/users/{{ u.name }}/reset-password"><button>Сбросить пароль</button></form>{% if u.deactivated %}<form class="inline" method="post" action="/users/{{ u.name }}/activate"><button>Активировать</button></form>{% else %}<form class="inline" method="post" action="/users/{{ u.name }}/deactivate"><button class="danger">Деактивировать</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
