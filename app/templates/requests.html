{% extends "base.html" %}{% block content %}<h1>Модерация</h1><table><tr><th>ID</th><th>Логин</th><th>ФИО</th><th>Инициатор</th><th>Статус</th><th>Действие</th></tr>{% for r in rows %}<tr><td>{{ r.id }}</td><td>@{{ r.username }}</td><td>{{ r.displayname }}</td><td>{{ r.requester }}</td><td><span class="badge {{ r.status|lower }}">{{ r.status }}</span></td><td>{% if r.status == "PENDING" %}<form class="inline" method="post" action="/requests/{{ r.id }}/approve"><button>✓ Одобрить</button></form><form class="inline" method="post" action="/requests/{{ r.id }}/reject"><input name="reason" placeholder="Причина"><button class="danger">✕ Отклонить</button></form>{% endif %}</td></tr>{% endfor %}</table>{% endblock %}
