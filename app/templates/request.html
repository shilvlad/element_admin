
{% extends 'base.html' %}

{% block content %}
<h1>Заявка на Matrix-пользователя</h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post">
    <label>
        Username
        <input name="username" placeholder="ivanov.i" required>
    </label>

    <label>
        Отображаемое имя
        <input name="displayname">
    </label>

    <label>
        Email/ФИО заявителя
        <input name="requester" required>
    </label>

    <button>Создать заявку</button>
</form>
{% endblock %}
